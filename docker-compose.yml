services:
  db:
    image: postgres:16-alpine
    container_name: salonflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salonflow_admin
      POSTGRES_PASSWORD: salonflow_admin_dev
      POSTGRES_DB: salonflow
    ports:
      - "5434:5432"
    volumes:
      - salonflow_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salonflow_admin -d salonflow"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  salonflow_pgdata:
