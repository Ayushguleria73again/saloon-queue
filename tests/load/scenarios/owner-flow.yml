# Owner / Staff Flow Scenario for Artillery
# Models salon operator workflow: dashboard load -> queue inspection -> call next -> start service -> complete/skip -> refresh
name: "Owner Queue Management Journey"
weight: 15
beforeScenario: "prepareOwnerScenario"
flow:
  # 1. Fetch branch queue overview
  - get:
      url: "/api/owner/branches/{{ branchId }}/queue"
      headers:
        x-forwarded-for: "{{ clientIp }}"
        Accept: "application/json"
        Cookie: "authjs.session-token={{ ownerSessionToken }}"
      afterResponse: "captureEtag"
      expect:
        - statusCode: 200

  # 2. Staff think time: reviewing queue on tablet/laptop (1-3 seconds)
  - think: 2

  # 3. Call the next customer in queue (Strict FIFO row lock FOR UPDATE SKIP LOCKED)
  - post:
      url: "/api/owner/branches/{{ branchId }}/queue/call-next"
      headers:
        x-forwarded-for: "{{ clientIp }}"
        Content-Type: "application/json"
        Origin: "http://localhost:3000"
        Cookie: "authjs.session-token={{ ownerSessionToken }}"
      capture:
        - json: "$.token.id"
          as: "calledTokenId"
      expect:
        - statusCode:
            - 200
            - 400 # 400 NO_WAITING_CUSTOMERS is valid when queue is temporarily empty

  # 4. If a token was called, transition to IN_SERVICE
  - think: 2
  - patch:
      url: "/api/owner/branches/{{ branchId }}/tokens/{{ calledTokenId }}/status"
      ifTrue: "calledTokenId"
      headers:
        x-forwarded-for: "{{ clientIp }}"
        Content-Type: "application/json"
        Origin: "http://localhost:3000"
        Cookie: "authjs.session-token={{ ownerSessionToken }}"
      json:
        action: "START_SERVICE"
      expect:
        - statusCode:
            - 200
            - 400

  # 5. Service duration think time
  - think: 2

  # 6. Complete service
  - patch:
      url: "/api/owner/branches/{{ branchId }}/tokens/{{ calledTokenId }}/status"
      ifTrue: "calledTokenId"
      headers:
        x-forwarded-for: "{{ clientIp }}"
        Content-Type: "application/json"
        Origin: "http://localhost:3000"
        Cookie: "authjs.session-token={{ ownerSessionToken }}"
      json:
        action: "COMPLETE"
      expect:
        - statusCode:
            - 200
            - 400

  # 7. Refresh branch queue overview
  - get:
      url: "/api/owner/branches/{{ branchId }}/queue"
      headers:
        x-forwarded-for: "{{ clientIp }}"
        Accept: "application/json"
        Cookie: "authjs.session-token={{ ownerSessionToken }}"
      expect:
        - statusCode: 200

