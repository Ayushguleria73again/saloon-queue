config:
  target: "http://localhost:3000"
  environments:
    local:
      target: "http://localhost:3000"
    docker:
      target: "http://localhost:80"
  processor: "../data/helper.js"
  http:
    timeout: 25
    extendedMetrics: true
    maxSockets: 1000
  phases:
    - name: "Pre-spike Steady State (25 VUs)"
      duration: 5
      arrivalRate: 5
    - name: "Flash Spike (1200 VUs)"
      duration: 10
      arrivalRate: 120
    - name: "Secondary Surge (500 VUs)"
      duration: 5
      arrivalRate: 100
    - name: "System Recovery (50 VUs)"
      duration: 10
      arrivalRate: 5

scenarios:
  - name: "Customer Queue Journey"
    weight: 85
    beforeScenario: "prepareCustomerScenario"
    flow:
      - get:
          url: "/api/public/salons/{{ salonSlug }}/{{ branchSlug }}"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Accept: "application/json"
          expect:
            - statusCode:
                - 200
                - 429
                - 503
      - think: 1
      - post:
          url: "/api/public/salons/{{ salonSlug }}/{{ branchSlug }}/tokens"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Content-Type: "application/json"
            Origin: "http://localhost:3000"
          json:
            fullName: "{{ fullName }}"
            mobileNumber: "{{ mobileNumber }}"
            serviceIds: "{{ serviceIds }}"
            website: ""
            idempotencyKey: "{{ idempotencyKey }}"
            notes: "Spike test"
          afterResponse: "checkTokenResponse"
          capture:
            - json: "$.token.publicId"
              as: "publicId"
            - json: "$.token.tokenNumber"
              as: "tokenNumber"
          expect:
            - statusCode:
                - 200
                - 201
                - 429
                - 503
      - think: 1
      - get:
          url: "/api/public/tokens/{{ publicId }}"
          ifTrue: "publicId"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Accept: "application/json"
          afterResponse: "captureEtag"
          expect:
            - statusCode:
                - 200
                - 429
                - 503
      - think: 1
      - get:
          url: "/api/public/tokens/{{ publicId }}"
          ifTrue: "publicId"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Accept: "application/json"
            If-None-Match: "{{ lastEtag }}"
          expect:
            - statusCode:
                - 200
                - 304
                - 429
                - 503
      - think: 1
      - post:
          url: "/api/public/tokens/{{ publicId }}/cancel"
          ifTrue: "shouldCancel"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Content-Type: "application/json"
            Origin: "http://localhost:3000"
          json:
            reason: "Spike cancel"
          expect:
            - statusCode:
                - 200
                - 400
                - 429
                - 503

  - name: "Owner Queue Management Journey"
    weight: 15
    beforeScenario: "prepareOwnerScenario"
    flow:
      - get:
          url: "/api/owner/branches/{{ branchId }}/queue"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Accept: "application/json"
            Cookie: "authjs.session-token={{ ownerSessionToken }}"
          expect:
            - statusCode:
                - 200
                - 429
      - think: 1
      - post:
          url: "/api/owner/branches/{{ branchId }}/queue/call-next"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Content-Type: "application/json"
            Origin: "http://localhost:3000"
            Cookie: "authjs.session-token={{ ownerSessionToken }}"
          capture:
            - json: "$.token.id"
              as: "calledTokenId"
          expect:
            - statusCode:
                - 200
                - 400
                - 429
      - think: 1
      - patch:
          url: "/api/owner/branches/{{ branchId }}/tokens/{{ calledTokenId }}/status"
          ifTrue: "calledTokenId"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Content-Type: "application/json"
            Origin: "http://localhost:3000"
            Cookie: "authjs.session-token={{ ownerSessionToken }}"
          json:
            action: "START_SERVICE"
          expect:
            - statusCode:
                - 200
                - 400
                - 429
      - think: 1
      - patch:
          url: "/api/owner/branches/{{ branchId }}/tokens/{{ calledTokenId }}/status"
          ifTrue: "calledTokenId"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Content-Type: "application/json"
            Origin: "http://localhost:3000"
            Cookie: "authjs.session-token={{ ownerSessionToken }}"
          json:
            action: "COMPLETE"
          expect:
            - statusCode:
                - 200
                - 400
                - 429
      - get:
          url: "/api/owner/branches/{{ branchId }}/queue"
          headers:
            x-forwarded-for: "{{ clientIp }}"
            Accept: "application/json"
            Cookie: "authjs.session-token={{ ownerSessionToken }}"
          expect:
            - statusCode:
                - 200
                - 429

