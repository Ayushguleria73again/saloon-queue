services:
  db:
    image: postgres:16-alpine
    container_name: salonflow-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: salonflow_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-salonflow_admin_dev}
      POSTGRES_DB: salonflow
    volumes:
      - salonflow_prod_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salonflow_admin -d salonflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - salonflow-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salonflow-prod-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app_runtime:${DB_RUNTIME_PASSWORD:-salonflow_app_dev}@db:5432/salonflow?schema=public
      DIRECT_URL: postgresql://salonflow_admin:${DB_ADMIN_PASSWORD:-salonflow_admin_dev}@db:5432/salonflow?schema=public
      OUTBOX_WORKER_ENABLED: "true"
      OUTBOX_POLL_INTERVAL_MS: "3000"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-salonflow_prod_secret_key_minimum_32_chars_long!}
      AUTH_URL: ${AUTH_URL:-${NEXTAUTH_URL:-http://localhost}}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:-salonflow_prod_secret_key_minimum_32_chars_long!}}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      IP_HASH_SALT: ${IP_HASH_SALT:-salonflow_prod_ip_hash_salt_32_chars_long!}
      CRON_SECRET: ${CRON_SECRET:-salonflow_cron_secret_prod_key_32_chars!}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:security@salonflow.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - salonflow-network

  proxy:
    image: nginx:alpine
    container_name: salonflow-prod-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - salonflow-network

networks:
  salonflow-network:
    driver: bridge

volumes:
  salonflow_prod_pgdata:

